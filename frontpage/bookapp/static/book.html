<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Web Design Book Cover</title>
  <style>
    /* Reset styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-image: url('background.jpg'); /* Use your chosen background image */
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
    }

    .cover {
      background-color: rgba(0, 0, 0, 0.55); /* transparent overlay for readability */
      padding: 60px 40px;
      border-radius: 20px;
      width: 80%;
      max-width: 900px;
    }

    .cover h1 {
      font-size: 70px;
      line-height: 1.2;
      margin-bottom: 15px;
    }

    .cover p {
      font-size: 22px;
      margin-top: 10px;
    }

    .author {
      margin-top: 40px;
      font-size: 24px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .cover h1 {
        font-size: 45px;
      }
      .cover p {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="cover">
    <h1>Responsive</h1>
    <h1>Web Design With</h1>
    <h1>HTML5 and CSS</h1>

    <p>Deep dive into HTML, CSS and JS basics</p>
    <p>Top seller of 2025</p>

    <p class="author">Special Edition by Evangeline</p>
  </div>
</body>
</html>
